version: 2
project:
  name: {{PROJECT_NAME}}
  classification: {{CLASSIFICATION}}
instructions:
  authoritative: AGENTS.md
  mirrors:
    - CLAUDE.md
  sha256: {{INSTRUCTION_SHA256}}
