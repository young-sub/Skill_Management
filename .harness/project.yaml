  "impact": {
    "rules": [
      {"id": "harness-core", "source_prefixes": ["authoring/scripts/core_harness.py"], "tests": ["tests/harness/test_core_first_schema.py", "tests/harness/test_core_first_setup.py", "tests/harness/test_core_first_design_execution.py", "tests/harness/test_core_first_close_lifecycle.py", "tests/harness/test_core_first_cutover.py", "tests/harness/test_core_first_forward_workflows.py", "tests/harness/test_core_first_cli_maintain.py", "tests/harness/test_core_first_installed_cli_e2e.py"], "feature": "harness-core", "triggers": ["shared_runtime"]},
      {"id": "harness-schema", "source_prefixes": ["authoring/schemas/v3/"], "tests": ["tests/harness/test_core_first_schema.py", "tests/harness/test_core_first_design_execution.py", "tests/harness/test_core_first_close_lifecycle.py", "tests/harness/test_core_first_cutover.py"], "feature": "harness-core", "triggers": ["schema"]},
      {"id": "generated-skills", "source_prefixes": ["authoring/", "skills/"], "tests": ["tests/distribution/test_sync_skill_resources.py", "tests/distribution/test_validate_distribution.py"], "feature": "distribution", "triggers": []},
      {"id": "shared-harness-resources", "source_prefixes": ["authoring/templates/", "authoring/references/", "authoring/resource-map.json", "authoring/public-resource-manifest.json", "skills/setup-agent-harness/", "skills/design-goal/", "skills/execute-codex-goal/", "skills/close-goal/", "skills/maintain-agent-harness/", "skills/diagnose/"], "tests": ["tests/harness", "tests/distribution/test_sync_skill_resources.py", "tests/distribution/test_validate_distribution.py"], "feature": "harness-core", "triggers": []},
      {"id": "repository-docs", "source_prefixes": ["docs/", "AGENTS.md", "CLAUDE.md", "README.md"], "tests": ["tests/distribution/test_repository_docs.py", "tests/harness/test_core_first_cutover.py"], "feature": "documentation", "triggers": []},
      {"id": "distribution-scripts", "source_prefixes": ["scripts/"], "tests": ["tests/distribution"], "feature": "distribution", "triggers": []},
      {"id": "control-plane", "source_prefixes": [".harness/"], "tests": ["tests/harness/test_core_first_cutover.py"], "feature": "harness-core", "triggers": ["repository_workflow_cutover"]},
      {"id": "harness-tests", "source_prefixes": ["tests/harness/"], "tests": ["tests/harness"], "feature": "harness-core", "triggers": []},
      {"id": "distribution-tests", "source_prefixes": ["tests/distribution/"], "tests": ["tests/distribution"], "feature": "distribution", "triggers": []},
      {"id": "release-tests", "source_prefixes": ["tests/release/"], "tests": ["tests/release"], "feature": "release", "triggers": []},
      {"id": "test-discovery-controls", "source_prefixes": ["tests/__init__.py", "tests/harness/__init__.py", "tests/distribution/__init__.py", "tests/release/__init__.py"], "tests": ["tests"], "feature": "repository", "triggers": ["test_discovery"]},
      {"id": "ci-workflow", "source_prefixes": [".github/"], "tests": ["tests/release/test_release_candidate.py"], "feature": "distribution", "triggers": ["repository_workflow_cutover"]},
      {"id": "retired-root-design", "source_prefixes": ["skill_recreate_plan.md"], "tests": ["tests/distribution/test_repository_docs.py"], "feature": "documentation", "triggers": []},
      {"id": "distribution-metadata", "source_prefixes": ["distribution/"], "tests": ["tests/distribution", "tests/release"], "feature": "distribution", "triggers": []},
      {"id": "legacy-preservation", "source_prefixes": ["legacy-skills/"], "tests": ["tests/distribution/test_validate_distribution.py"], "feature": "distribution", "triggers": []},
      {"id": "repository-ignore", "source_prefixes": [".gitignore"], "tests": ["tests/harness/test_core_first_setup.py", "tests/harness/test_core_first_design_execution.py"], "feature": "harness-core", "triggers": []}
    ],
    "feature_selectors": {
      "harness-core": ["python", "-m", "unittest", "tests.harness.test_core_first_schema", "tests.harness.test_core_first_setup", "tests.harness.test_core_first_design_execution", "tests.harness.test_core_first_close_lifecycle", "tests.harness.test_core_first_cutover", "tests.harness.test_core_first_forward_workflows", "tests.harness.test_core_first_cli_maintain", "tests.harness.test_core_first_installed_cli_e2e"],
      "distribution": ["python", "-m", "unittest", "discover", "-s", "tests/distribution", "-p", "test_*.py"],
      "release": ["python", "-m", "unittest", "discover", "-s", "tests/release", "-p", "test_*.py"],
      "documentation": ["python", "-m", "unittest", "tests.distribution.test_repository_docs"],
      "repository": ["python", "-m", "unittest", "discover", "-s", "tests", "-p", "test_*.py"]
    },
    "full_triggers": ["shared_runtime", "schema", "test_discovery", "repository_workflow_cutover"]
  },
  "commands": {
    "targeted": {"id": "targeted", "argv": ["python", "-m", "unittest"], "working_directory": ".", "platform": "any", "runtime": "python", "capability": "selected-test"},
    "feature": {"id": "feature", "argv": ["python", "-m", "unittest", "tests.harness.test_core_first_schema", "tests.harness.test_core_first_setup", "tests.harness.test_core_first_design_execution", "tests.harness.test_core_first_close_lifecycle", "tests.harness.test_core_first_cutover", "tests.harness.test_core_first_forward_workflows", "tests.harness.test_core_first_cli_maintain", "tests.harness.test_core_first_installed_cli_e2e"], "working_directory": ".", "platform": "any", "runtime": "python", "capability": "harness-core"},
    "lint": {"id": "lint", "argv": ["git", "diff", "--check"], "working_directory": ".", "platform": "any", "runtime": "git", "capability": "format"},
    "type": {"id": "type", "argv": [], "working_directory": ".", "platform": "any", "runtime": "none", "capability": "not-configured"},
    "build": {"id": "build", "argv": [], "working_directory": ".", "platform": "any", "runtime": "none", "capability": "not-configured"},
    "full": {"id": "full", "argv": ["python", "-m", "unittest", "discover", "-s", "tests", "-p", "test_*.py"], "working_directory": ".", "platform": "any", "runtime": "python", "capability": "repository"},
    "live": {"id": "live", "argv": [], "working_directory": ".", "platform": "any", "runtime": "none", "capability": "disabled"},
    "eval": {"id": "eval", "argv": [], "working_directory": ".", "platform": "any", "runtime": "none", "capability": "disabled"}
  },
  "documents": {"boundaries": [{"paths": ["authoring", "skills"], "documents": ["docs/architecture/harness.md"]}, {"paths": ["tests", "scripts"], "documents": ["docs/testing.md"]}]},
  "work": {"retention": {"completed_days": 30, "trash_days": 7}, "states": ["active", "completed", "trash", "deleted"], "legacy_state": "legacy-unclassified"},
  "git": {"capture_current_base": true, "protected_branches": ["main"], "branch_pattern": "wp-{work_id}-{slug}", "commit_per_item": true, "worktrees_for_independent_items": true},
  "baseline": {"findings": []},
  "extensions": {}
