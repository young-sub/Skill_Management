name: Validate distribution

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Generated resource drift
        shell: pwsh
        run: scripts/sync-skill-resources.ps1 -Check
      - name: Distribution contract
        shell: pwsh
        run: scripts/validate-distribution.ps1
      - name: Reproduce isolated pilots
        run: python scripts/run-v2-pilots.py --output-dir ${{ runner.temp }}/harness-v2-pilots
