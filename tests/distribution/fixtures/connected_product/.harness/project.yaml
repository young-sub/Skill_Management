{
  "schema_version": 3,
  "project": {
    "name": "Connected Product Acceptance Fixture",
    "classification": "greenfield"
  },
  "paths": {
    "source_roots": [
      "app.py",
      "domain.py",
      "ui.js",
      "shared.css",
      "index.html",
      "history.html",
      "run_project.py",
      "browser_drive.cjs"
    ],
    "test_roots": [
      "test_domain.py"
    ],
    "fixture_roots": [],
    "generated_roots": [],
    "durable_document_roots": [
      "docs"
    ],
    "human_guide_roots": [],
    "ephemeral_work_root": ".work",
    "documentation_entrypoint": "docs/index.md"
  },
  "impact": {
    "rules": [
      {
        "id": "connected-product-flow",
        "source_prefixes": [
          "app.py",
          "domain.py",
          "ui.js",
          "shared.css",
          "index.html",
          "history.html"
        ],
        "tests": [
          "test_domain.py"
        ],
        "feature": "connected-product-flow",
        "triggers": []
      }
    ],
    "feature_selectors": {
      "connected-product-full-stack": [
        "python",
        "run_project.py",
        "--report",
        "{report_dir}/browser.json"
      ]
    },
    "full_triggers": [
      "schema"
    ]
  },
  "commands": {
    "targeted": {
      "id": "targeted",
      "argv": [
        "python",
        "-m",
        "unittest"
      ],
      "working_directory": ".",
      "platform": "any",
      "runtime": "python",
      "capability": "selected-test"
    },
    "feature": {
      "id": "feature",
      "argv": [
        "python",
        "-m",
        "unittest",
        "test_domain"
      ],
      "working_directory": ".",
      "platform": "any",
      "runtime": "python",
      "capability": "domain-test"
    },
    "lint": {
      "id": "lint",
      "argv": [],
      "working_directory": ".",
      "platform": "any",
      "runtime": "none",
      "capability": "not-configured"
    },
    "type": {
      "id": "type",
      "argv": [],
      "working_directory": ".",
      "platform": "any",
      "runtime": "none",
      "capability": "not-configured"
    },
    "build": {
      "id": "build",
      "argv": [],
      "working_directory": ".",
      "platform": "any",
      "runtime": "none",
      "capability": "not-configured"
    },
    "full": {
      "id": "full",
      "argv": [
        "python",
        "-m",
        "unittest",
        "test_domain"
      ],
      "working_directory": ".",
      "platform": "any",
      "runtime": "python",
      "capability": "domain-test"
    },
    "live": {
      "id": "live",
      "argv": [],
      "working_directory": ".",
      "platform": "any",
      "runtime": "none",
      "capability": "disabled"
    },
    "eval": {
      "id": "eval",
      "argv": [],
      "working_directory": ".",
      "platform": "any",
      "runtime": "none",
      "capability": "disabled"
    }
  },
  "documents": {
    "boundaries": [
      {
        "paths": [
          "app.py",
          "domain.py",
          "ui.js",
          "shared.css"
        ],
        "documents": [
          "docs/acceptance.md",
          "docs/ui-guide.md"
        ]
      }
    ]
  },
  "work": {
    "retention": {
      "completed_days": 7,
      "trash_days": 3
    },
    "states": [
      "active",
      "completed",
      "trash",
      "deleted"
    ],
    "legacy_state": "legacy-unclassified"
  },
  "git": {
    "capture_current_base": true,
    "protected_branches": [
      "main"
    ],
    "branch_pattern": "wp-{work_id}-{slug}",
    "commit_per_item": true,
    "worktrees_for_independent_items": true
  },
  "baseline": {
    "findings": []
  },
  "extensions": {
    "workflow": {
      "roots": [
        "app.py",
        "domain.py",
        "ui.js",
        "shared.css",
        "index.html",
        "history.html",
        "run_project.py",
        "browser_drive.cjs",
        "test_domain.py",
        ".harness",
        "docs",
        "assertions.json"
      ],
      "state": ".work/workflow/state.json",
      "assertions": "assertions.json",
      "features": [
        {
          "id": "connected-product-flow",
          "partition": "product",
          "sources": [
            "app.py",
            "domain.py",
            "ui.js",
            "shared.css",
            "index.html",
            "history.html",
            "run_project.py",
            "browser_drive.cjs",
            "test_domain.py",
            ".harness/project.yaml",
            "assertions.json",
            "docs/index.md",
            "docs/acceptance.md",
            "docs/feature-map.md",
            "docs/ui-guide.md"
          ],
          "map": [
            "docs/feature-map.md"
          ],
          "criteria": [
            "docs/acceptance.md",
            "docs/ui-guide.md"
          ],
          "checks": [
            "connected-product-full-stack"
          ],
          "coverage": [
            {
              "id": "business-fe",
              "requirement": "docs/acceptance.md",
              "outcome": "The user submits a quantity from the accessible entry screen.",
              "perspectives": [
                "business"
              ],
              "areas": [
                "FE"
              ],
              "kind": "test",
              "method": "e2e",
              "check": "connected-product-full-stack"
            },
            {
              "id": "business-api",
              "requirement": "docs/acceptance.md",
              "outcome": "The API accepts valid values and reports the shared domain rejection.",
              "perspectives": [
                "business"
              ],
              "areas": [
                "BE/API"
              ],
              "kind": "test",
              "method": "e2e",
              "check": "connected-product-full-stack"
            },
            {
              "id": "business-domain",
              "requirement": "docs/acceptance.md",
              "outcome": "Negative values fail and zero remains valid.",
              "perspectives": [
                "business"
              ],
              "areas": [
                "Domain"
              ],
              "kind": "test",
              "method": "e2e",
              "check": "connected-product-full-stack"
            },
            {
              "id": "architecture-fe",
              "requirement": "docs/acceptance.md",
              "outcome": "The two screens reuse the shared navigation component and tokens.",
              "perspectives": [
                "architecture"
              ],
              "areas": [
                "FE"
              ],
              "kind": "review",
              "method": "e2e"
            },
            {
              "id": "architecture-api",
              "requirement": "docs/acceptance.md",
              "outcome": "The API owns request validation and stores only domain-approved values.",
              "perspectives": [
                "architecture"
              ],
              "areas": [
                "BE/API"
              ],
              "kind": "review",
              "method": "cross-layer"
            },
            {
              "id": "architecture-domain",
              "requirement": "docs/acceptance.md",
              "outcome": "A single domain rule is shared by writes and the SQLite constraint protects persisted state.",
              "perspectives": [
                "architecture"
              ],
              "areas": [
                "Domain"
              ],
              "kind": "review",
              "method": "cross-layer"
            }
          ],
          "ui": [
            "docs/ui-guide.md"
          ],
          "prevention": [
            {
              "failure": "negative quantity bypasses Domain validation",
              "scope": "quantity write",
              "check": "connected-product-full-stack",
              "normal_exception": "zero is a valid quantity",
              "reconsider": "quantity contract changes"
            },
            {
              "failure": "shared mobile controls below minimum target",
              "scope": "two-screen navigation",
              "check": "connected-product-full-stack",
              "normal_exception": "history rows and mobile layout remain visible",
              "reconsider": "supported viewport or accessibility target changes"
            }
          ]
        }
      ],
      "ui_systems": {
        "connected-product-ui": {
          "guide": "docs/ui-guide.md",
          "tokens": [
            "shared.css"
          ],
          "components": [
            "ui.js"
          ],
          "consumers": [
            "connected-product-flow"
          ],
          "exceptions": []
        }
      }
    }
  }
}
