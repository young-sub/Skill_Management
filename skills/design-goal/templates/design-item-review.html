<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>설계 검토</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f1eee5;
      --sheet: #fffdf8;
      --ink: #17201d;
      --muted: #65706a;
      --line: #d7d3c7;
      --accent: #c65432;
      --accent-soft: #f5ddd2;
      --teal: #164f4b;
      --serif: "Iowan Old Style", "Noto Serif KR", "Batang", serif;
      --sans: "Pretendard Variable", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 4%, rgba(198,84,50,.11), transparent 26rem),
        linear-gradient(90deg, rgba(23,32,29,.025) 1px, transparent 1px),
        var(--paper);
      background-size: auto, 28px 28px, auto;
      font: 16px/1.68 var(--sans);
    }
    .review-shell { width: min(1180px, calc(100% - 40px)); margin: 40px auto 96px; }
    .review-masthead {
      position: relative;
      overflow: hidden;
      padding: clamp(34px, 6vw, 76px);
      color: #f9f5e9;
      background: var(--ink);
      border-radius: 4px 4px 28px 4px;
      box-shadow: 0 24px 60px rgba(23,32,29,.17);
    }
    .review-masthead::after {
      content: "設計";
      position: absolute; right: -18px; top: -52px;
      color: rgba(255,255,255,.045); font: 900 clamp(9rem, 24vw, 18rem)/1 var(--serif);
      pointer-events: none;
    }
    .document-mark { display: flex; gap: 12px; align-items: baseline; position: relative; z-index: 1; }
    .document-mark span { color: #f2a78c; font-weight: 800; letter-spacing: .08em; }
    .document-mark strong { color: #9ba6a0; font-size: .72rem; letter-spacing: .16em; }
    h1, h2 { font-family: var(--serif); letter-spacing: -.035em; }
    h1 { position: relative; z-index: 1; max-width: 850px; margin: 28px 0 16px; font-size: clamp(2.35rem, 5.4vw, 4.9rem); line-height: 1.08; }
    .standfirst { position: relative; z-index: 1; max-width: 720px; margin: 0 0 40px; color: #c9d0cb; font-size: 1.06rem; }
    .review-facts { position: relative; z-index: 1; display: grid; grid-template-columns: 1.2fr 1fr 1fr .8fr; margin: 0; border-top: 1px solid #46504c; }
    .review-facts div { padding: 18px 18px 0 0; }
    .review-facts dt { color: #f2a78c; font-size: .7rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .review-facts dd { margin: 6px 0 0; color: #f6f3e9; font-size: .92rem; line-height: 1.55; }
    .item { margin-top: 26px; padding: clamp(24px, 4.5vw, 52px); background: var(--sheet); border: 1px solid var(--line); border-radius: 4px 24px 4px 4px; box-shadow: 0 12px 34px rgba(23,32,29,.07); }
    .item, .review-section, .behavior-visual, .behavior-map, .flow-step { min-width: 0; }
    h1, h2, dd, li, .flow-step p { overflow-wrap: anywhere; }
    .item-heading { display: grid; grid-template-columns: 140px 1fr auto; gap: 24px; align-items: start; padding-bottom: 26px; border-bottom: 3px solid var(--ink); }
    .item-heading > div { display: grid; gap: 7px; }
    .item-id { color: var(--accent); font: 900 1.6rem/1 var(--serif); }
    .item-kind { color: var(--muted); font-size: .72rem; font-weight: 800; letter-spacing: .1em; }
    .item-heading h2 { margin: -5px 0 0; font-size: clamp(1.8rem, 3.4vw, 3rem); line-height: 1.15; }
    .status { padding: 7px 11px; color: var(--teal); background: #dcebe7; border: 1px solid #a6c9c1; border-radius: 999px; font-size: .78rem; font-weight: 900; white-space: nowrap; }
    .review-section { padding-top: 30px; }
    .review-section + .review-section { margin-top: 30px; border-top: 1px solid var(--line); }
    .review-section h3 { display: flex; gap: 12px; align-items: baseline; margin: 0 0 16px; font: 800 1.02rem/1.3 var(--sans); }
    .review-section h3 span { color: var(--accent); font: 900 .72rem/1 var(--serif); letter-spacing: .08em; }
    .lead-copy { max-width: 900px; margin: 0; font: 600 clamp(1.18rem, 2.1vw, 1.55rem)/1.58 var(--serif); }
    .term-note { display: grid; grid-template-columns: 120px 1fr; gap: 20px; margin-top: 24px; padding: 18px 20px; background: #f3f0e8; border-left: 4px solid var(--teal); }
    .term-note h4 { margin: 2px 0; color: var(--teal); font-size: .76rem; letter-spacing: .08em; }
    .term-note dl { margin: 0; }
    .term-entry { display: grid; grid-template-columns: minmax(110px, .35fr) 1fr; gap: 14px; }
    .term-entry + .term-entry { margin-top: 9px; }
    .term-entry dt { font-weight: 900; }
    .term-entry dd { margin: 0; color: var(--muted); }
    .behavior-visual { margin: 0; padding: 24px; background: #f4f1e9; border: 1px solid #ddd8cb; }
    .behavior-visual figcaption { margin-bottom: 18px; color: var(--teal); font-size: .76rem; font-weight: 900; letter-spacing: .12em; }
    .behavior-map { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 0; padding: 0; list-style: none; counter-reset: stage; }
    .flow-step { position: relative; min-height: 126px; padding: 18px; background: var(--sheet); border-top: 3px solid var(--teal); counter-increment: stage; }
    .flow-step::after { content: counter(stage, decimal-leading-zero); position: absolute; right: 12px; bottom: 7px; color: #ddd8cb; font: 900 2rem/1 var(--serif); }
    [data-visual="migration"] .flow-step { border-top-color: var(--accent); }
    .stage-label { display: block; color: var(--accent); font-size: .68rem; font-weight: 900; letter-spacing: .1em; }
    .flow-step p { position: relative; z-index: 1; margin: 16px 0 0; font-weight: 700; line-height: 1.48; }
    .evidence-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 30px; border-top: 1px solid var(--line); }
    .evidence-grid .review-section { margin: 0; border: 0; }
    .review-list, .criteria-list, .boundary-list, .risk-list { margin: 0; padding: 0; list-style: none; }
    .review-list li, .criteria-list li, .boundary-list li, .risk-list li { position: relative; padding: 10px 0 10px 24px; border-bottom: 1px solid #e5e1d6; }
    .review-list li::before, .criteria-list li::before { content: "◆"; position: absolute; left: 0; color: var(--teal); font-size: .62rem; }
    .criteria-list li::before { content: "✓"; color: var(--accent); font-weight: 900; }
    .boundary-section { padding: 25px; background: #f1eee5; }
    .boundary-list li::before { content: "↳"; position: absolute; left: 0; color: var(--teal); font-weight: 900; }
    .risk-section { padding: 25px; color: #6b2d1d; background: var(--accent-soft); border: 0 !important; }
    .risk-list li::before { content: "!"; position: absolute; left: 3px; font-weight: 900; }
    @media (max-width: 800px) {
      .review-facts { grid-template-columns: 1fr 1fr; }
      .item-heading { grid-template-columns: 1fr auto; }
      .item-heading h2 { grid-column: 1 / -1; grid-row: 2; }
      .evidence-grid { grid-template-columns: 1fr; gap: 0; }
    }
    @media (max-width: 520px) {
      .review-shell { width: min(100% - 20px, 1180px); margin-top: 10px; }
      .review-masthead, .item { padding: 24px 20px; border-radius: 3px 16px 3px 3px; }
      .review-facts { grid-template-columns: 1fr; }
      .review-facts div { padding-top: 14px; }
      .term-note, .term-entry { grid-template-columns: 1fr; gap: 5px; }
      .behavior-map { grid-template-columns: 1fr; }
      .flow-step { min-height: 96px; }
    }
    @media print { body { background: white; } .review-shell { width: 100%; margin: 0; } .item { box-shadow: none; break-inside: avoid; } }
  </style>
</head>
