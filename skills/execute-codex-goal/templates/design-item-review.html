<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>구현 계획</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f1ec;
      --sheet: #fffefa;
      --ink: #18201d;
      --muted: #65706a;
      --line: #d8d8d0;
      --soft: #eef2ee;
      --accent: #b94f32;
      --serif: "Iowan Old Style", "Noto Serif KR", "Batang", serif;
      --sans: "Pretendard Variable", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 16px/1.65 var(--sans); }
    .review-shell { width: min(980px, calc(100% - 40px)); margin: 44px auto 88px; }
    .review-masthead { padding: 10px 0 34px; border-top: 6px solid var(--accent); border-bottom: 1px solid var(--ink); }
    .document-mark { display: flex; justify-content: space-between; gap: 20px; margin-top: 16px; color: var(--accent); font-size: .76rem; font-weight: 900; letter-spacing: .09em; }
    .document-mark strong { color: var(--muted); font-weight: 700; }
    h1, h2 { font-family: var(--serif); letter-spacing: -.035em; }
    h1 { max-width: 820px; margin: 28px 0 12px; font-size: clamp(2.15rem, 5vw, 4.2rem); line-height: 1.1; }
    .standfirst { max-width: 760px; margin: 0; color: var(--muted); font-size: 1.06rem; }
    .item { margin-top: 56px; padding: 0 0 46px; border-bottom: 1px solid var(--line); }
    .item-heading { display: grid; grid-template-columns: 74px 1fr auto; gap: 18px; align-items: baseline; padding-bottom: 20px; border-bottom: 3px solid var(--ink); }
    .item-id { color: var(--accent); font: 900 1rem/1 var(--sans); }
    .item-heading h2 { margin: 0; font-size: clamp(1.7rem, 3.4vw, 2.65rem); line-height: 1.18; }
    .status { color: #8a321f; font-size: .78rem; font-weight: 900; }
    .review-section { display: grid; grid-template-columns: 142px minmax(0, 1fr); gap: 26px; padding: 28px 0; border-bottom: 1px solid var(--line); }
    .review-section h3 { margin: 2px 0 0; font-size: .82rem; line-height: 1.35; letter-spacing: .04em; }
    .section-body { min-width: 0; grid-column: 2; }
    .lead-copy { max-width: 720px; margin: 0; font: 600 1.18rem/1.65 var(--serif); }
    .behavior-visual { min-width: 0; margin: 0; }
    .behavior-visual figcaption { display: none; }
    .behavior-map { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 22px; margin: 0; padding: 0; list-style: none; counter-reset: step; }
    .flow-step { position: relative; min-width: 0; padding: 14px 16px; background: var(--soft); border-top: 2px solid #75817a; counter-increment: step; }
    .flow-step:not(:last-child)::after { content: "→"; position: absolute; right: -18px; top: 50%; color: #9ca49f; font-weight: 900; transform: translateY(-50%); }
    .stage-label { display: block; color: var(--accent); font-size: .68rem; font-weight: 900; letter-spacing: .06em; }
    .flow-step p { margin: 8px 0 0; font-weight: 700; line-height: 1.48; overflow-wrap: anywhere; }
    .table-wrap { min-width: 0; overflow-x: auto; }
    .test-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: .92rem; }
    .test-table th, .test-table td { padding: 14px 16px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
    .test-table thead th { color: white; background: var(--ink); font-size: .76rem; letter-spacing: .03em; }
    .test-table thead th:first-child { width: 22%; }
    .test-table thead th:last-child { width: 28%; }
    .test-table tbody th { color: var(--accent); background: #faf8f3; font-size: .86rem; }
    .result-section { border-bottom: 0; }
    .result-list { margin: 0; padding: 18px 22px 18px 42px; background: #f4ece7; }
    .result-list li + li { margin-top: 8px; }
    @media (max-width: 680px) {
      .review-shell { width: min(100% - 24px, 980px); margin-top: 18px; }
      .item { margin-top: 40px; }
      .item-heading { grid-template-columns: 58px 1fr; gap: 12px; }
      .item-heading .status { grid-column: 2; }
      .review-section { grid-template-columns: 1fr; gap: 12px; padding: 22px 0; }
      .section-body { grid-column: 1; }
      .behavior-map { grid-template-columns: 1fr; gap: 10px; }
      .flow-step:not(:last-child)::after { content: "↓"; right: 16px; top: auto; bottom: -17px; z-index: 2; }
      .test-table, .test-table tbody, .test-table tr, .test-table th, .test-table td { display: block; width: 100%; }
      .test-table thead { display: none; }
      .test-table tr { margin-bottom: 14px; border: 1px solid var(--line); }
      .test-table th, .test-table td { display: grid; grid-template-columns: 92px 1fr; gap: 10px; border-bottom: 1px solid var(--line); }
      .test-table tbody th::before { content: "검증 대상"; color: var(--muted); }
      .test-table td:nth-of-type(1)::before { content: "테스트"; color: var(--muted); font-weight: 800; }
      .test-table td:nth-of-type(2)::before { content: "통과 기준"; color: var(--muted); font-weight: 800; }
      .test-table td:last-child { border-bottom: 0; }
    }
    @media print { body { background: white; } .review-shell { width: 100%; margin: 0; } .item { break-inside: avoid; } }
  </style>
</head>
<body><main class="review-shell">{{SUMMARY}}{{ITEMS}}</main></body>
</html>
